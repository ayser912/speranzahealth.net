# Builds the Astro site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://speranzahealth.net
      PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-links.mjs && node scripts/check-schema.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver) which URLs exist after each deploy.
  # Bing's index feeds ChatGPT search and Microsoft Copilot. The key file is public by design.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          KEY: 965b3ab17b9309143252a3d7cd8f200b
          HOST: speranzahealth.net
        run: |
          sleep 30
          URLS=$(curl -fsSL "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(python3 -c 'import json,os,sys; print(json.dumps({"host":os.environ["HOST"],"key":os.environ["KEY"],"keyLocation":"https://"+os.environ["HOST"]+"/"+os.environ["KEY"]+".txt","urlList":json.loads(sys.argv[1])}))' "$URLS")
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY")
          COUNT=$(echo "$URLS" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "::notice title=IndexNow::HTTP $CODE for $COUNT URLs"
          case "$CODE" in 200|202) ;; *) echo "::warning title=IndexNow::Submission not accepted (HTTP $CODE)"; exit 1;; esac
